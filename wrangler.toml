name = "foro"
main = "worker/worker.js"
compatibility_date = "2026-07-01"

routes = [
  { pattern = "foro.meowrhino.studio", custom_domain = true }
]

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/r2/*"]

[vars]
TABLE_PREFIX = "foro_"
ADMIN_USER = "manu"

# fase pruebas: d1 compartida `shop` (tablas foro_*).
# al traspasar a la cuenta del cliente: crear d1 propia y cambiar name/id.
[[d1_databases]]
binding = "DB"
database_name = "shop"
database_id = "6c1c1e51-76d4-4ab3-a912-7e7ad2749eca"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "foro-media"

# backup semanal (lunes 4:04 utc); a github solo si existen los secrets
# GITHUB_TOKEN (pat con scope repo) y BACKUP_REPO ("owner/repo")
[triggers]
crons = ["4 4 * * 1"]

[[unsafe.bindings]]
name = "WRITE_LIMITER"
type = "ratelimit"
namespace_id = "3001"
simple = { limit = 8, period = 60 }
